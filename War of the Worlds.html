function mulberry32(a){return()=>{let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

const LEVEL_COUNT=20,LEVEL_START=6,LEVEL_SPAN=62;
const TILE=40,WORLD_W=LEVEL_START+LEVEL_COUNT*LEVEL_SPAN+8,WORLD_H=32,WORLD_PX=WORLD_W*TILE;
const tiles=new Uint8Array(WORLD_W*WORLD_H);
const tile=(x,y)=>y*WORLD_W+x;
function solid(x,y){if(x<0||x>=WORLD_W||y>=WORLD_H)return true;return tiles[tile(x,y)]===1}
function levelBase(level){return LEVEL_START+level*LEVEL_SPAN}
function makeWorld(){
  tiles.fill(0);
  // A continuous concrete street is always available. Raised surfaces are optional
  // one-tile steps/platforms, so the player never has to clear a gap to progress.
  const ground=25;
  for(let x=0;x<WORLD_W;x++) for(let y=ground;y<WORLD_H;y++) tiles[tile(x,y)]=1;
  const platformOffsets=[[7,12],[18,22],[29,34],[41,46],[52,56]];
  for(let level=0;level<LEVEL_COUNT;level++){
    const sx=levelBase(level);
    for(const [a,b] of platformOffsets){
      for(let xx=sx+a;xx<sx+b&&xx<WORLD_W;xx++) tiles[tile(xx,24)]=1;
    }
  }
}
makeWorld();
function surfaceYAt(px){
  const tx=clamp(Math.floor(px/TILE),0,WORLD_W-1);
  for(let y=0;y<WORLD_H;y++) if(solid(tx,y)) return y*TILE;
  return (WORLD_H-1)*TILE;
}
function levelBounds(level){
  const base=levelBase(level);
  return {min:Math.max(0,(base-1)*TILE),max:Math.min(WORLD_PX-1,(base+LEVEL_SPAN-2)*TILE)};
}

   const xx=ox+dir*i*sw,amp=(i/seg)*4.5,wave=Math.sin(t+i*.72)*amp+Math.sin(t*.7+i*1.33)*amp*.25;
   top.push([xx,oy+wave]);bottom.push([xx,oy+f.h+wave*.55]);
 }
 ctx.beginPath();ctx.moveTo(...top[0]);for(let i=1;i<=seg;i++)ctx.lineTo(...top[i]);for(let i=seg;i>=0;i--)ctx.lineTo(...bottom[i]);ctx.closePath();

 // Use recognizable cloth designs instead of tiny text printed on a flag.

 if(f.kind==='us'){

 if(hood.street==='residential'||hood.street==='leafy'){for(let xx=b.min+95;xx<b.max;xx+=260){ctx.fillStyle='#a9966f';ctx.fillRect(xx,g+22,34,11);ctx.fillStyle='#6b8a58';ctx.fillRect(xx+3,g+13,28,10)}}
 // Tree canopy is especially important in the residential Northwest and rowhouse districts.
 const spacing=Math.max(210,560-hood.trees*55);for(let xx=b.min+150;xx<b.max-80;xx+=spacing){if(((xx/TILE|0)+chapter)%3!==0||hood.trees>=4)drawTree(xx,g,hood.trees>=4?1:0.82)}
 ctx.restore();
}
function drawCity(){
 const hood=neighborhoods[chapter];drawNeighborhoodLandmark(hood);
 for(const b of buildings){if(b.x+b.w<camX-120||b.x>camX+VIEW.w+120||b.level!==chapter)continue;drawBuilding(b,hood)}
 for(const d of wallDecals){if(d.x<camX-80||d.x>camX+VIEW.w+80||d.level!==chapter)continue;ctx.save();ctx.translate(d.x,d.y);ctx.rotate(d.rot);ctx.shadowColor='#0005';ctx.shadowBlur=2;ctx.fillStyle='#d9c79e';ctx.fillRect(-2,-12,72,22);ctx.shadowBlur=0;ctx.fillStyle='#2f2730';ctx.font='bold 8px monospace';ctx.fillText(d.text,3,3);ctx.fillStyle='#aa916f';ctx.fillRect(3,7,56,1);ctx.restore()}
 for(const f of flags)if(f.level===chapter&&f.x+f.w>camX-100&&f.x-f.w<camX+VIEW.w+100&&f.y<surfaceYAt(f.x)-245)drawFlag(f);
}
function drawFlyer(f){
 const t=performance.now()/420+f.phase;const drift=Math.sin(t*.8)*f.drift;const x=f.x+drift,y=f.y+Math.sin(t*1.2)*7;const safeY=Math.min(y,surfaceYAt(x)-122-f.h);
 ctx.save();ctx.translate(x,safeY);ctx.rotate(Math.sin(t)*.035);ctx.shadowColor='#0006';ctx.shadowBlur=6;ctx.shadowOffsetX=3;ctx.shadowOffsetY=5;ctx.fillStyle='#eee3c7';ctx.fillRect(0,0,f.w,f.h);ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.strokeStyle='#51463e';ctx.lineWidth=2;ctx.strokeRect(1,1,f.w-2,f.h-2);ctx.fillStyle='#31272e';ctx.font='bold 11px monospace';ctx.fillText(f.head,8,15);ctx.fillStyle='#53464a';ctx.font='bold 8px monospace';f.lines.forEach((line,i)=>ctx.fillText(line.slice(0,32),8,31+i*12));ctx.fillStyle='#8a7b69';ctx.font='7px monospace';ctx.fillText(f.stamp,8,f.h-8);ctx.globalAlpha=.2;ctx.strokeStyle='#7d6c58';ctx.beginPath();ctx.moveTo(f.w*.18,3);ctx.lineTo(f.w*.23,f.h-3);ctx.moveTo(f.w*.7,2);ctx.lineTo(f.w*.65,f.h-4);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle='#d3c2a0';ctx.beginPath();ctx.moveTo(f.w-18,0);ctx.lineTo(f.w,0);ctx.lineTo(f.w,f.h-18);ctx.closePath();ctx.fill();ctx.restore();
}
function drawFlyers(){for(const f of flyers){if(f.level!==chapter)continue;if(f.x+f.w<camX-120||f.x>camX+VIEW.w+120)continue;if(f.y<camY-140||f.y>camY+VIEW.h+80)continue;drawFlyer(f);}}
function loop(now){const dt=Math.min(40,now-last);last=now;update(dt);draw();clearPressed();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
